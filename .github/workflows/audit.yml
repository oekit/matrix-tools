name: Matrix audit

# 两种触发，两种职责：
#   - schedule / workflow_dispatch：周报模式，发现漂移开/更新 issue（给人看）；
#   - pull_request：门禁模式，发现漂移直接让 PR 红（不给漂移合进 main 的机会）。
#
# PR 模式是后加的，原因很实际：漂移 issue 是**周报**性质的，它描述的是
# 「上周一早上世界是什么样」——报告生成与修复之间天然有时间差，报告里的
# 条目常常在发出后不久就被别的波次带走了（#26 的 8 项漂移即如此，全部是
# 报告比修复早）。周报能告诉你「该修了」，但拦不住「带着漂移合进来」。
# 门禁才是那道真正拦人的墙。
on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  issues: write

concurrency:
  group: matrix-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 脚本自测：判据脚本自己先得能证明「它抓得住自己要防的东西」。
  #
  # 为什么单开一个 job（而不是并进 audit）：audit 测的是**矩阵**有没有漂移，
  # 这里测的是**脚本自己的判据**是否有效——两者互不依赖，混在一起会让其中一个
  # 挂了看不出来是谁的问题。
  #
  # 共享的 python-ci.yml 刻意不执行脚本本体（有些脚本缺 --help 会直接跑真实
  # 动作），所以自测放在本仓 workflow 里跑；close_issue 的自测用假 gh + 临时
  # 目录，**无副作用、不联网、不依赖工作区布局**。
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: close_issue 自测（回执必须真落地，不能假绿）
        run: python3 scripts/close_issue_selftest.py
      - name: close_issue 回执「变更内容」定位自测（能定位到本条 / 定位不到要明说 / PR 号不算 issue 引用 / 变异自证）
        run: python3 scripts/close_issue_locate_selftest.py
      - name: dependabot 目录门禁自测（残留条目必须抓得到，且非 gomod 生态不误报）
        run: python3 scripts/dependabot_dirs_selftest.py
      - name: ghsafe 读取层自测（读到空 ≠ 事实为空，不能假红也不能假绿）
        run: python3 scripts/ghsafe_selftest.py
      - name: 远端读取层自测（git 传输侧读到空 ≠ 事实为空，不能静默降级）
        run: python3 scripts/remote_reads_selftest.py
      - name: git 网络子进程有界化自测（挂死必须有界失败，keepalive 必须真进子进程）
        run: python3 scripts/git_env_selftest.py
      - name: 发版单元门禁自测（伞仓 BOM 漏检必须抓得到，口径不许分裂）
        run: python3 scripts/verify_release_units_selftest.py
      - name: hostVersion 完备性自测（候选集不完备必须 fail closed，不许静默降级成旧值）
        run: python3 scripts/host_version_selftest.py
      - name: hostVersion 完备性自测·变异自证（注入变异体 ⇒ 精确转红集合必须精确）
        run: python3 scripts/host_version_selftest.py --mutate
      - name: 发布序列门禁自测（版本号回退必须抓得到，已登记例外不许掩盖新问题）
        run: python3 scripts/verify_version_line_selftest.py
      - name: 维护轮门禁自测（仓读不到不许报「零漂移」，到期不许不报）
        run: python3 scripts/maintenance_check_selftest.py
      - name: release_train CHANGELOG 环节自测（预校验必须真跑、多条 bullet 不丢条目）
        run: python3 scripts/release_train_selftest.py
      - name: 发版分支名 slug 自测（分支名必须单层/唯一/含版本号，退回旧写法必须转红）
        run: python3 scripts/release_train_slug_selftest.py
      - name: 版本节读路径自测（嵌套 tag 读承载变更描述的那一面 / 回退规则 / Release 正文承载描述）
        run: python3 scripts/changelog_section_selftest.py
      - name: 版本节读路径自测·变异自证（注入变异体 ⇒ 精确转红集合必须精确）
        run: python3 scripts/changelog_section_selftest.py --mutate
      - name: Release 正文重渲染自测（默认只预览 / 幂等 / fail closed 不写空正文）
        run: python3 scripts/rerender_release_body_selftest.py
      - name: Release 正文重渲染自测·变异自证（注入变异体 ⇒ 精确转红集合必须精确）
        run: python3 scripts/rerender_release_body_selftest.py --mutate
      - name: 发版「依赖可解析」门禁自测（父仓地板未发布必须判出 / 同 train 放行 / 远端读不到 fail closed / 变异自证）
        run: python3 scripts/release_train_requires_selftest.py
      - name: 发版「依赖可解析」门禁·变异自证（注入变异体 ⇒ 精确转红集合必须精确）
        run: python3 scripts/release_train_requires_selftest.py --mutate
      - name: DESC 子包口径自测（声明的「N 合 1」必须等于实际公开子包）
        run: python3 scripts/desc_count_selftest.py
      - name: BOM 生成器 Go 地板自测（取不到 go.mod 必须报错，不许兜底假地板）
        run: python3 scripts/gen_matrix_go_selftest.py
      - name: 审计远端事实缓存自测（同仓只读一次，失败态也不许重打网络）
        run: python3 scripts/tag_cache_selftest.py
      - name: 地板对齐自测（深层嵌套模块必须扫得到，vendor 必须排除）
        run: python3 scripts/align_floors_selftest.py
      - name: 地板对齐「嵌套模块地板」自测（别仓嵌套模块必须看得见 / 嵌套 tag 前缀是完整子路径 / 变异自证）
        run: python3 scripts/align_floors_nested_selftest.py
      - name: 审计「各仓 go.mod 地板 vs 远端 tag」门禁自测（落后必须判出、数字比、变异自证）
        run: python3 scripts/audit_floor_gate_selftest.py
      - name: 审计「各仓对别仓嵌套模块的地板」门禁自测（落后必须判出 / 口径不与根模块重叠 / 变异自证）
        run: python3 scripts/audit_nested_floor_gate_selftest.py
      - name: 审计假绿自测（崩了≠零漂移 / CI 判退出码+成功标记 / 深层 CHANGELOG 扫得到 / 门禁不可用判红 / 变异自证）
        run: python3 scripts/audit_fail_loud_selftest.py
      - name: 工具链闸门自测（合并回退只在 CLEAN 放行 / CHANGELOG 覆写要 --apply / local_dir 只此一份）
        run: python3 scripts/toolchain_selftest.py
      - name: 台账写入器自测（事实与现实不符必须拒绝写入 / 收口必须报出漂移 / 坏账不许覆盖）
        run: python3 scripts/ledger_write_selftest.py
      - name: 台账写入器自测·变异自证（封存保证 / 收口范围 / 修正通道 ⇒ 精确转红集合必须精确）
        run: python3 scripts/ledger_write_selftest.py --mutate
      - name: 历史回执重渲染自测（只编辑原评论不新发 / 已是 #153 形态幂等跳过 / 无回执与多条回执明确报错 / 变异自证）
        run: python3 scripts/rerender_receipt_selftest.py
      - name: 写回前置门禁自测（跨仓号/本仓其它号/裸号都抓得住 / PR 引用与顶格段落不误报 / 判据看位置不看存在性 / 变异自证）
        run: python3 scripts/check_writeback_selftest.py
      - name: 地板类断言核验器自测（逐字节未变/零行为风险落到 git 对象层核 / 读不到≠成立 / 否定语境不误报）
        run: python3 scripts/floor_claim_check_selftest.py
      - name: 地板类断言核验器·变异自证（注入变异体 ⇒ 精确转红集合必须精确）
        run: python3 scripts/floor_claim_check_selftest.py --mutate
      - name: 检查面 G 自测（打 tag 的模块 require 必须是最新已发布版本 / 落后一档与前瞻引用都拒绝 / 完整子路径前缀 / 远端读不到 fail closed）
        run: python3 scripts/release_train_latest_selftest.py
      - name: 检查面 G·变异自证（退回旧实现 / 落后放行 / 前缀截断 / fail-open ⇒ 精确转红集合必须精确）
        run: python3 scripts/release_train_latest_selftest.py --mutate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Clone all matrix repos（清单来自 matrix.py——旧硬编码含已删的 istio/handler，clone 404 导致 weekly job 一直起不来）
        run: |
          mkdir -p repos
          MODS=$(python3 -c "import matrix; print(' '.join(matrix.MODULES))")
          for m in $MODS; do
            git clone --quiet "https://github.com/oekit/$m.git" "repos/$m"
          done
          git clone --quiet "https://github.com/oekit/oekit.github.io.git" "repos/oekit.github.io"
          git clone --quiet "https://github.com/oekit/oekit.git" "repos/oekit"
      - name: Run audit
        id: audit
        env:
          # Release 对账要逐仓读 24 个仓的 releases 列表。匿名 REST 只有 60 次/小时，
          # 而 Actions runner 共享出口 IP，逐仓一查就打满 → 全矩阵一起「读不到」，
          # 门禁静默失效（#26：23/24 仓被跳过，报告仍显示通过）。
          # 跨仓读必须用 org PAT：GITHUB_TOKEN 是本仓 installation token，读不到别的仓。
          GH_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # ⚠️ **判据从「报告文本里有没有 ❌」改成「审计有没有跑完」**
          #   （实测 2026-11-03）：旧写法 `... || true` + `grep -c '❌'` 在
          #   audit.py 崩掉时（报告 0 字节）得到 drift=0 ⇒ 「Fail on drift」
          #   步骤不触发 ⇒ **PR 门禁判成零漂移全绿**（假绿）。
          #   现在按**退出码**判：0=通过 / 1=真漂移 / 2=基础设施失败。
          #   （`|| rc=$?` 而不是 `|| true`：GitHub 的 run 块默认 `bash -e`，
          #     直接跑一条会失败的命令会让整个步骤提前退出，拿不到退出码。）
          rc=0
          MATRIX_BASE="$PWD/repos" python3 scripts/audit.py --remote-tags > audit-report.txt || rc=$?
          cat audit-report.txt
          drift=$(grep -c '❌' audit-report.txt || true)
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          echo "audit_rc=$rc" >> "$GITHUB_OUTPUT"
          # 兜底：**报告里没有「✓ 矩阵审计通过」⇒ 结论不可信**（崩了 / 被 kill /
          #   报告为空 / 退出码与报告自相矛盾）⇒ audit_ok=0 ⇒ 下面的门禁判红。
          if [ "$rc" = "0" ] && grep -q '✓ 矩阵审计通过' audit-report.txt; then
            echo "audit_ok=1" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "1" ] && [ "$drift" != "0" ]; then
            echo "audit_ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "audit_ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: 地板类断言扫描（CHANGELOG + 已发布 Release 正文里的「逐字节未变/零行为风险」必须落到 git 对象层核）
        env:
          # Release 正文要走 GitHub API（GITHUB_TOKEN 是本仓 installation token，读不到别的仓）
          GH_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # 退出码契约：发现**为假**的断言 ⇒ 1（PR 门禁直接红）；读不到的面只 ⚠️ 不阻断
          MATRIX_BASE="$PWD/repos" python3 scripts/floor_claim_check.py
      - name: Close previous drift issue
        # ⚠️ 只有审计**真的跑完**（audit_ok=1）且零漂移才关单：
        #   审计崩了（drift=0）也关单 ⇒ 把上一轮的真实漂移 issue 关掉（假绿）。
        if: github.event_name != 'pull_request' && steps.audit.outputs.drift == '0' && steps.audit.outputs.audit_ok == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'matrix-drift'
            });
            for (const i of issues) {
              await github.rest.issues.update({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: i.number, state: 'closed' });
            }
      - name: Open drift issue
        if: github.event_name != 'pull_request' && steps.audit.outputs.drift != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = '矩阵审计发现漂移，本地跑 `matrix-tools` 的对应生成器修复：\n\n```\n'
              + fs.readFileSync('audit-report.txt', 'utf8') + '\n```';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'matrix-drift'
            });
            if (issues.length) {
              await github.rest.issues.update({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner,
                repo: context.repo.repo, title: '矩阵漂移报告', body, labels: ['matrix-drift'] });
            }
      - name: 审计未跑完 ⇒ 判红（基础设施失败，不是「零漂移」）
        # audit.py 崩了 / 被 kill / 报告为空 ⇒ 结论行「✓ 矩阵审计通过」不存在
        # （或退出码与报告自相矛盾）⇒ 旧门禁在这里判成「零漂移」⇒ PR 全绿
        # （假绿，实测 2026-11-03：audit.py 崩 ⇒ stdout 0 字节 ⇒ grep -c ❌ = 0）。
        # ⇒ 判红；且上一轮的漂移 issue **不关**（上面的 Close 步骤已按 audit_ok 守卫）。
        if: steps.audit.outputs.audit_ok != '1'
        run: |
          echo "::error::审计没有产出可信结论（退出码 ${{ steps.audit.outputs.audit_rc }}，报告里 ❌ 行 ${{ steps.audit.outputs.drift }} 条）——审计崩了或没跑完，**不是**「零漂移」。详情见上方 audit-report.txt 与本步骤日志。"
          exit 1
      - name: Fail on drift (PR only)
        # PR 门禁：漂移不让合。**不开 issue**——PR 上每推一次提交就开一个
        # issue 会把 issue 池冲垮，漂移详情留在本步骤的日志里就够了。
        # ⚠️ 判据同时看 **drift 与 audit_ok**：审计没跑完（audit_ok=0）时
        #   drift 可能是 0（旧写法的假绿形态）⇒ 必须一并判红。
        if: github.event_name == 'pull_request' && (steps.audit.outputs.drift != '0' || steps.audit.outputs.audit_ok != '1')
        run: |
          echo "::error::矩阵审计未通过（漂移 ${{ steps.audit.outputs.drift }} 项，审计退出码 ${{ steps.audit.outputs.audit_rc }}）——本 PR 不能合。详情见上方 audit-report.txt（本地复现：python3 scripts/audit.py --remote-tags）"
          exit 1

  # 消费面承诺巡检：矩阵对外的「按需取用 / 零捆绑 / 嵌套隔离 / 一次拉齐」
  # 四条承诺，此前只靠人肉抽查过一次。这里每次周巡检都**重新实测**——
  # 判据是消费方真实模块图（go list -m all），不是任何仓的 go.mod 声明。
  #
  # 为什么**不进 PR 门禁**：它测的是各仓**已发布**版本（go get @latest），
  # PR 里的改动尚未发布，测了也只是测旧状态。PR 门禁仍是上面的 audit。
  consumer:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Clone all matrix repos
        run: |
          mkdir -p repos
          MODS=$(python3 -c "import matrix; print(' '.join(matrix.MODULES))")
          for m in $MODS; do
            git clone --quiet "https://github.com/oekit/$m.git" "repos/$m"
          done
          git clone --quiet "https://github.com/oekit/oekit.github.io.git" "repos/oekit.github.io"
          git clone --quiet "https://github.com/oekit/oekit.git" "repos/oekit"
      - name: 消费面依赖画像 + 隔离承诺核验
        id: probe
        env:
          GH_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MATRIX_BASE="$PWD/repos" python3 scripts/consumer_probe.py --base "$PWD/repos" \
            --json consumer-profile.json | tee consumer-report.txt
          echo "broken=$(grep -c '❌' consumer-report.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Upload consumer profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-profile
          path: consumer-profile.json
      - name: 画像写回站点（数据变了才开 PR）
        # 产物 PR 纪律：生成器在 matrix-tools，产物在站点仓——由巡检**开 PR**，
        # 不直接推 main。时间戳不计入差异，否则每周都会开一个内容无变化的 PR。
        if: github.event_name != 'pull_request'
        env:
          # ⚠️ 跨仓写 oekit.github.io ⇒ 必须是 **PAT**（classic PAT 有 repo scope）。
          # GITHUB_TOKEN 只对**本仓**（matrix-tools）有效 ⇒ 拿它推 oekit.github.io
          # 必然 403/无凭据。OEKIT_PROJECT_TOKEN 是本 org 各仓都有的 classic PAT，
          # 优先用它；MATRIX_AUDIT_TOKEN 留给将来换成更窄权限的专用 token。
          GH_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.OEKIT_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MATRIX_AUDIT_TOKEN || secrets.OEKIT_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repos/oekit.github.io
          if python3 ../../scripts/gen_deps_doc.py --profile ../../consumer-profile.json --site . --check; then
            echo "画像与站点现状一致，无需改动"
            exit 0
          fi
          python3 ../../scripts/gen_deps_doc.py --profile ../../consumer-profile.json --site . \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git config user.name "oekit-bot"
          git config user.email "bot@oekit.github.io"
          git checkout -B chore/deps-profile
          git add docs/public/deps.json docs/guide/getting-started.md
          git commit -m "chore(site): 刷新消费面依赖画像（consumer_probe 实测）"
          # 跨仓 push 必须带凭据。
          #
          # 2026-10-27 实测踩过：上面 clone oekit.github.io 用的是**无凭据**的
          # HTTPS URL ⇒ `git push` 报 "could not read Username for 'https://github.com'"
          # ⇒ 写回必然失败 ⇒ 这个 job 从来没绿过 ⇒ 站点画像冻结在 2026-10-21。
          # 关键：**GH_TOKEN / GITHUB_TOKEN 只对 `gh` CLI 生效，git 不认它们**
          # ⇒ 必须显式塞进 http.extraheader（用 extraheader 而不是改 remote URL：
          # token 不落进 .git/config，也不进 git remote -v 的输出）。
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if ! git -c "http.https://github.com/.extraheader=$AUTH_HEADER" \
               push --force origin chore/deps-profile; then
            echo "::error::写回站点失败：git push 拿不到 oekit.github.io 的写权限。" \
                 "跨仓 push 必须用 PAT（OEKIT_PROJECT_TOKEN / MATRIX_AUDIT_TOKEN）；" \
                 "GITHUB_TOKEN 只对本仓有效，会在这里失败。"
            exit 1
          fi
          gh pr create --repo oekit/oekit.github.io --head chore/deps-profile \
            --title "chore(site): 刷新消费面依赖画像（consumer_probe 实测）" \
            --body "由 matrix-tools 的周巡检（audit.yml 的 consumer job）自动生成：每个发版单元的消费方模块图规模与第三方依赖数。数据变了才开 PR（时间戳不计入差异）。" || true
      - name: Open consumer issue
        if: github.event_name != 'pull_request' && steps.probe.outputs.broken != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = '消费面承诺被打破（本地复现：`python3 scripts/consumer_probe.py`）：\n\n```\n'
              + fs.readFileSync('consumer-report.txt', 'utf8') + '\n```';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'matrix-consumer'
            });
            if (issues.length) {
              await github.rest.issues.update({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner,
                repo: context.repo.repo, title: '消费面承诺被打破', body, labels: ['matrix-consumer'] });
            }
      - name: Close previous consumer issue
        if: github.event_name != 'pull_request' && steps.probe.outputs.broken == '0'
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'matrix-consumer'
            });
            for (const i of issues) {
              await github.rest.issues.update({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: i.number, state: 'closed' });
            }
